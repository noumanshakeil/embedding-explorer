<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>{{ title }}</title><link rel="stylesheet" href="/static/styles.css"/></head><body><main>
<h1>{{ title }}</h1><p class="sub">Index docs, search nearest neighbors with offline embeddings.</p>
<div class="grid"><section class="card">
<form method="post" action="/ui/docs"><label>Title</label><input name="title" required/><label>Text</label><textarea name="text" rows="5" required></textarea><button type="submit">Embed</button></form>
</section><section class="card">
<form method="get" action="/"><label>Query</label><input name="q" value="{{ q }}"/><button type="submit">Search</button></form>
{% for h in hits %}<div class="card" style="margin:.4rem 0"><span class="pill">{{ h.score }}</span> {{ h.title }}<div class="sub">{{ h.snippet }}</div></div>{% endfor %}
<h3>Corpus</h3>{% for d in docs %}<div class="sub">{{ d.title }}</div>{% endfor %}
</section></div></main></body></html>
